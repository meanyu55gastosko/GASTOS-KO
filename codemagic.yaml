workflows:
  budget-vs-gastos-apk:
    name: Gastos Ko APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore App Code & Setup Core Files
        script: |
          echo "=== RESTORE YOUR BUDGET CODE ==="
          git checkout main -- lib/ assets/ pubspec.yaml 2>/dev/null || git checkout HEAD -- lib/ assets/ || true
          git checkout c5f9933 -- lib/ || true
          
      - name: Recreate Android Project Envelope
        script: |
          echo "=== KEEP FRESH ANDROID FROM FLUTTER (AGP MATCHED) ==="
          rm -rf android
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 .
          
      - name: Configure Android Label & Manifest
        script: |
          echo "=== SET APP NAME TO Gastos Ko ==="
          # Safer text modification logic for Mac OS shell runners
          sed -i '' 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml
          grep label android/app/src/main/AndroidManifest.xml
          
      - name: Generate Custom Android App Launcher Icon
        script: |
          echo "=== GENERATE ICON ==="
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
          flutter pub add flutter_launcher_icons --dev
          flutter pub get
          dart run flutter_launcher_icons
          ls android/app/src/main/res/mipmap-hdpi/ic_launcher.png && echo "ICON PROCESS OK!"
          
      - name: Build Protected Release APK
        script: |
          flutter clean
          flutter pub get
          # Added --no-tree-shake-icons to prevent missing custom icon glitches
          flutter build apk --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
          
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
