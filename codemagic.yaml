workflows:
  budget-vs-gastos-apk:
    name: Gastos Ko APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore App + Set Name + Icon
        script: |
          echo "=== RESTORE YOUR BUDGET CODE ==="
          # Panatilihin ang kasalukuyang binagong code sa main branch na may PlatformDispatcher
          git checkout main -- lib/ assets/ pubspec.yaml 2>/dev/null || git checkout HEAD -- lib/ assets/ || true
          
          # I-back up muna ang pubspec.yaml para hindi masira ng 'flutter create'
          cp pubspec.yaml pubspec.yaml.bak
          
          echo "=== KEEP FRESH ANDROID FROM FLUTTER 3.32.8 (AGP 8.7.3) ==="
          rm -rf android
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 .
          
          # Ibalik ang orihinal na pubspec.yaml at ang ating pinakahuling code
          mv pubspec.yaml.bak pubspec.yaml
          git checkout main -- lib/ assets/ 2>/dev/null || git checkout HEAD -- lib/ assets/ || true
          
          echo "=== SET APP NAME TO Gastos Ko ==="
          sed -i '' 's/android:label="[^"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml
          grep label android/app/src/main/AndroidManifest.xml
          
          echo "=== GENERATE ICON ==="
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
          
          flutter pub add flutter_launcher_icons --dev || true
          flutter pub get
          dart run flutter_launcher_icons || true
          
          if [ -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            echo "ICON GENERATED OK!"
          else
            echo "WARNING: Icon generation failed, checking fallback..."
          fi
      - name: Build Protected APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
