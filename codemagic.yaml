workflows:
  budget-vs-gastos-apk:
    name: Gastos Ko APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch and Verify Current Branch Code
        script: |
          echo "=== USING YOUR LATEST COMPILED CODE FROM WORKSPACE ==="
          # Inalis ang mapanganib na hardcoded git checkout commits para protektahan ang bagong code mo
          git status
          ls lib/main.dart && echo "CORE CORE CORE FILE OK!"
          
      - name: Recreate Android Project Envelope
        script: |
          echo "=== KEEP FRESH ANDROID FROM FLUTTER (AGP MATCHED) ==="
          rm -rf android
          flutter create --platforms=android --org com.gastosko.app --project-name budget_vs_gastosv1 .
          
      - name: Configure Android Label & Manifest
        script: |
          echo "=== SET APP NAME TO Gastos Ko ==="
          # Itinama ang string handling parameter para sa macOS sed engine shell
          sed -i '' 's/android:label="[^\"]*"/android:label="Gastos Ko"/' android/app/src/main/AndroidManifest.xml
          grep -i "label" android/app/src/main/AndroidManifest.xml
          
      - name: Generate Custom Android App Launcher Icon
        script: |
          echo "=== GENERATE ICON ==="
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
          flutter pub add flutter_launcher_icons --dev
          flutter pub get
          dart run flutter_launcher_icons
          
      - name: Build Protected Release APK
        script: |
          flutter clean
          flutter pub get
          # --no-tree-shake-icons ay kasama para protektahan ang PDF icons laban sa biglang pagkawala
          flutter build apk --release --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
          
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
